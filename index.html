<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171717"><title>오운랩 50분 타이머</title><style>
:root{color-scheme:dark;--bg:#171717;--fg:#f5f0df;--accent:#00c698;--muted:#979a97}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,'Apple SD Gothic Neo',sans-serif}button,select,input{font:inherit}button,select{color:inherit;cursor:pointer}button{border:0;background:#282b29;border-radius:16px;padding:16px}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:4px}button:disabled{opacity:.4;cursor:default}main{width:min(100%,620px);margin:auto;padding:24px 28px 30px;min-height:100svh}header{display:flex;align-items:center;justify-content:space-between}header b{font-size:20px;letter-spacing:-1px}header b span{color:var(--accent)}#settings{background:none;font-size:14px;color:var(--muted);padding:10px}.progress{height:3px;background:#303330;margin-top:20px;overflow:hidden;border-radius:5px}.progress i{display:block;background:var(--accent);height:100%}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:12px}.stage{text-align:center;margin:26px 0 18px}.label{font-size:24px;font-weight:700;letter-spacing:-1px;margin:0 0 14px}.dial{position:relative;width:min(100%,360px);aspect-ratio:1;margin:auto;display:flex;flex-direction:column;align-items:center;justify-content:center}.dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}.track,.arc{fill:none;stroke-width:5}.track{stroke:#303631}.arc{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:1068.14;transition:stroke-dashoffset .18s linear}.clock{font-size:clamp(64px,19vw,100px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-6px;line-height:1.2}.phase{font-size:16px;color:var(--accent);margin-bottom:12px}.sub{font-size:13px;color:var(--muted);margin-top:12px;min-height:18px}.rounds{display:flex;gap:7px;justify-content:center;min-height:10px;margin:20px 0}.dot{width:6px;height:6px;border-radius:50%;background:#3d423e}.dot.past{background:#678075}.dot.active{background:var(--accent);width:18px;border-radius:4px}nav{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:0 auto 24px;max-width:360px}nav button:not(#go){width:52px;height:52px;border-radius:50%;padding:0;font-size:22px}#go{background:var(--accent);color:#0b211a;font-weight:700;flex:1;max-width:190px;font-size:18px;height:58px;border-radius:32px}.next-card{display:flex;align-items:center;justify-content:space-between;gap:20px;border-radius:18px;background:#222623;padding:20px 22px;font-size:14px}.next-card small{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}#nextTime{font-size:20px;font-variant-numeric:tabular-nums}.footer{text-align:center;color:#737b74;font-size:11px;margin-top:22px;letter-spacing:2px}dialog{width:min(92vw,480px);max-height:85svh;border:1px solid #3a403b;border-radius:24px;background:#202421;color:var(--fg);padding:24px}dialog::backdrop{background:#000a;backdrop-filter:blur(8px)}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.sheet-head h2{font-size:22px;margin:0}.sheet-head button{padding:10px}.options{display:grid;gap:12px}.options button,select{background:#2c322d;border:0;border-radius:12px;padding:15px;text-align:left}select{width:100%}.volume{display:flex;align-items:center;gap:15px;margin:8px 0;font-size:14px}input{accent-color:var(--accent);flex:1;min-width:0}details{margin-top:24px;font-size:14px}summary{cursor:pointer}ol{padding-left:20px;line-height:1.9;color:#bbc2bb}.hint{font-size:12px;color:#9ba59c;line-height:1.7}body.rest{--accent:#80cce3}body.done{--accent:#00c698}@media(min-width:900px){main{width:min(100%,900px)}.dial{width:420px}.clock{font-size:116px}.label{font-size:28px}.next-card{max-width:480px;margin:auto}}@media(max-height:760px){main{padding-top:14px}.stage{margin:16px 0 10px}.dial{width:min(75vw,290px)}.clock{font-size:80px}.rounds{margin:12px 0}nav{margin-bottom:16px}.footer{margin-top:14px}}@media(max-height:500px) and (orientation:landscape){main{max-width:950px;display:grid;grid-template-columns:1fr 1fr;gap:10px 36px;padding:14px 24px}header,.progress,.meta{grid-column:1/-1;margin:0}.stage{grid-column:1;grid-row:4/8;margin:0}.dial{width:220px}.label{font-size:18px;margin:0}.clock{font-size:64px}nav{grid-column:2;width:100%;margin:auto}.next-card{grid-column:2;width:100%}.footer{grid-column:2}.rounds{margin:6px}}
</style></head><body><main><header><b>오운랩<span>.</span></b><button id="settings" aria-label="타이머 설정">설정 ☰</button></header><div class="progress"><i id="bar"></i></div><div class="meta"><span>50분 클래스</span><span id="total"></span></div><section class="stage"><h1 class="label" id="label"></h1><div class="dial"><svg viewBox="0 0 360 360" aria-hidden="true"><circle class="track" cx="180" cy="180" r="170"/><circle id="ring" class="arc" cx="180" cy="180" r="170"/></svg><div id="phase" class="phase"></div><div class="clock" id="clock" role="timer"></div><div class="sub" id="sub"></div></div><div id="dots" class="rounds" aria-hidden="true"></div></section><nav><button id="prev" aria-label="이전 구간">‹</button><button id="go">시작</button><button id="nextBtn" aria-label="다음 구간">›</button></nav><div class="next-card"><div><small>다음</small><span id="next"></span></div><span id="nextTime"></span></div><div class="footer">OWN PACE LAB</div></main><dialog id="panel"><div class="sheet-head"><h2>타이머 설정</h2><button id="close">닫기</button></div><div class="options"><select id="jump" aria-label="구간 선택"></select><button id="sound" aria-pressed="true">소리 켜짐</button><label class="volume">벨 음량<input id="volume" type="range" min="0.1" max="1" step="0.05" value="0.8" aria-label="벨 음량"></label><button id="test">복싱 벨 미리 듣기</button><button id="full">전체 화면</button><button id="reset">처음부터</button></div><details><summary>50분 시간 구성</summary><ol id="outline"></ol></details><p class="hint">쉐도우 90초, 파트너 60초에 중간 신호가 울립니다.<br>기기 음량을 확인하고 화면을 켜둔 상태로 사용하세요.<br>스페이스 시작 / 일시정지, 방향키 구간 이동</p></dialog><script>
'use strict';
const PLAN=[];let acc=0;
function add(section,label,duration,kind='work',mid=0){PLAN.push({section,label,duration,kind,mid,start:acc,end:acc+duration});acc+=duration;}
function transition(){add('전환','구간 전환',30,'rest');}
// Every duration includes only its own work/rest. No implicit end rests.
for(let i=1;i<=6;i++){add('워밍업','워밍업 '+i+'/6',20);add('워밍업','워밍업 '+i+'/6',20);}
transition();
for(let i=1;i<=2;i++){add('스탠스와 풋워크','풋워크 '+i+'/2R',180);if(i<2)add('스탠스와 풋워크','라운드 휴식',60,'rest');}
transition();
for(let i=1;i<=6;i++){add('쉐도우','쉐도우 '+i+'/6R',180,'work',90);if(i<6)add('쉐도우','라운드 휴식',60,'rest');}
transition();
for(let i=1;i<=2;i++){add('파트너','파트너 '+i+'/2R',120,'work',60);if(i<2)add('파트너','라운드 휴식',60,'rest');}
transition();
[[20,10,4],[30,15,2],[30,15,4]].forEach(([work,rest,count],block)=>{for(let i=1;i<=count;i++){add('컨디셔닝','인터벌 '+(block+1)+' / '+i+'세트',work);add('컨디셔닝','인터벌 휴식',rest,'rest');}});
transition();add('쿨다운','쿨다운',120);
const TOTAL=acc;if(TOTAL!==3000)throw Error('Schedule must total 3000 seconds');
const $=id=>document.getElementById(id),fmt=n=>{n=Math.max(0,Math.ceil(n));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');};
let elapsed=0,running=false,base=0,epoch=0,audio=null,sound=true,wake=null,prevElapsed=0,lastSaved=0;
const KEY='ownpace-timer-v7';
function at(t){return PLAN.findIndex(p=>t<p.end);}
let volume=.8;
// Metallic bell: struck inharmonic partials with long decay, controlled by a compressor.
function bell(strikes=1){if(!sound||!audio)return;try{const bus=audio.createGain(),comp=audio.createDynamicsCompressor();bus.gain.value=volume*.8;comp.threshold.value=-12;comp.knee.value=12;comp.ratio.value=5;bus.connect(comp);comp.connect(audio.destination);for(let hit=0;hit<strikes;hit++){const t=audio.currentTime+hit*.3;[[620,.42,1.5],[974,.3,1.1],[1426,.2,.85],[1922,.13,.6],[2635,.08,.35]].forEach(([f,gain,decay])=>{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.003);g.gain.exponentialRampToValueAtTime(.0001,t+decay);o.connect(g);g.connect(bus);o.start(t);o.stop(t+decay+.05);});}setTimeout(()=>{bus.disconnect();comp.disconnect();},(strikes*.3+2)*1000);}catch(e){}}
function tone(freq=800,dur=.16){if(!sound||!audio)return;try{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;o.type='triangle';g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(volume*.25,audio.currentTime+.005);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur+.01);}catch(e){}}
async function unlock(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();await audio.resume();}catch(e){}}
async function lock(){try{wake=await navigator.wakeLock.request('screen');}catch(e){}}
function release(){if(wake){wake.release().catch(()=>{});wake=null;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({elapsed,at:Date.now()}));}catch(e){}}
function syncTime(){if(running)elapsed=Math.min(TOTAL,base+(performance.now()-epoch)/1000);}
function render(){let k=at(elapsed),p=PLAN[k];document.body.className=!p?'done':p.kind==='rest'?'rest':'';$('label').textContent=p?p.section:'수업 완료';$('clock').textContent=p?fmt(p.end-elapsed):'00:00';$('phase').textContent=!p?'수고하셨습니다':!running?(elapsed?'일시정지':'준비'):p.kind==='rest'?'휴식':p.section==='쿨다운'?'마무리':'운동';$('sub').textContent=p?(p.mid?(elapsed-p.start<p.mid?'전반':'후반')+' / '+p.label:p.label):'50분 완료';$('total').textContent='남은 시간 '+fmt(TOTAL-elapsed);$('bar').style.width=(elapsed/TOTAL*100)+'%';$('ring').style.strokeDashoffset=1068.14*(p?(elapsed-p.start)/p.duration:1);const upcoming=PLAN[k+1];$('next').textContent=p&&upcoming?upcoming.section==='전환'?'구간 전환':upcoming.label:'오늘 수업 마무리';$('nextTime').textContent=p&&upcoming?fmt(upcoming.duration):'';$('go').textContent=running?'일시정지':elapsed>=TOTAL?'완료':elapsed>0?'이어서':'시작';$('go').disabled=elapsed>=TOTAL;$('prev').disabled=elapsed===0;$('nextBtn').disabled=elapsed>=TOTAL;const rounds=p?PLAN.filter(x=>x.section===p.section&&x.kind==='work'):[];const active=p?rounds.filter(x=>x.start<=p.start).length-1:-1;const dotsKey=(p?.section??'done')+active;if($('dots').dataset.key!==dotsKey){$('dots').dataset.key=dotsKey;$('dots').innerHTML=rounds.map((x,i)=>'<i class="dot '+(i===active?'active':i<active?'past':'')+'"></i>').join('');}}
function pause(){syncTime();running=false;release();save();render();}
async function start(){if(running||elapsed>=TOTAL)return;await unlock();if(running)return;running=true;base=elapsed;epoch=performance.now();prevElapsed=elapsed;lock();bell(2);render();}
function move(t){syncTime();elapsed=Math.max(0,Math.min(TOTAL,t));base=elapsed;epoch=performance.now();prevElapsed=elapsed;if(elapsed===TOTAL){running=false;release();}save();render();}
function tick(){if(running){syncTime();let old=at(prevElapsed),now=at(elapsed);if(elapsed-prevElapsed<2){if(old!==now)bell(now<0?3:2);else if(now>=0){const p=PLAN[now];if(p.mid&&prevElapsed<p.start+p.mid&&elapsed>=p.start+p.mid)tone(1200,.25);else if(Math.ceil(p.end-elapsed)<=3&&Math.ceil(p.end-elapsed)!==Math.ceil(p.end-prevElapsed))tone(650,.08);}}if(elapsed>=TOTAL){running=false;release();save();}if(performance.now()-lastSaved>1000){save();lastSaved=performance.now();}prevElapsed=elapsed;render();}requestAnimationFrame(tick);}
$('settings').onclick=()=>$('panel').showModal();$('close').onclick=()=>$('panel').close();$('volume').oninput=e=>{volume=Number(e.target.value);};
$('go').onclick=()=>running?pause():start();$('prev').onclick=()=>{syncTime();const k=at(elapsed);move(PLAN[Math.max(0,(k<0?PLAN.length:k)-1)].start);};$('nextBtn').onclick=()=>{syncTime();const k=at(elapsed);if(k>=0)move(PLAN[k+1]?.start??TOTAL);};
$('reset').onclick=()=>{if(elapsed>0&&!confirm('타이머를 처음으로 되돌릴까요?'))return;pause();move(0);};
$('sound').onclick=async()=>{sound=!sound;$('sound').textContent=sound?'소리 켜짐':'소리 꺼짐';$('sound').setAttribute('aria-pressed',String(sound));if(sound){await unlock();tone();}};
$('test').onclick=async()=>{await unlock();bell(2);};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){$('full').textContent='전체 화면 미지원';}};
PLAN.forEach((p,i)=>{if(i===0||p.section!==PLAN[i-1].section){const o=document.createElement('option');o.value=p.start;o.textContent=fmt(p.start)+' '+p.section;$('jump').appendChild(o);}});$('jump').onchange=e=>move(Number(e.target.value));
[['워밍업','4분'],['스탠스와 풋워크','3분 × 2R / 사이 휴식 1분'],['쉐도우','3분 × 6R / 사이 휴식 1분'],['파트너','2분 × 2R / 사이 휴식 1분'],['컨디셔닝','20초/10초 × 4, 30초/15초 × 2, 30초/15초 × 4'],['쿨다운','2분'],['구간 전환','30초 × 5']].forEach(([s,t])=>{const li=document.createElement('li');li.textContent=s+' — '+t;$('outline').appendChild(li);});
document.addEventListener('keydown',e=>{if(['BUTTON','SELECT','INPUT'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();running?pause():start();}if(e.key==='ArrowRight')$('nextBtn').click();if(e.key==='ArrowLeft')$('prev').click();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&running)lock();});window.addEventListener('pagehide',()=>{syncTime();save();});
try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Date.now()-v.at<7200000&&Number.isFinite(v.elapsed))elapsed=Math.max(0,Math.min(TOTAL,v.elapsed));}catch(e){}
render();requestAnimationFrame(tick);
</script></body></html>
