<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171717"><title>오운랩 50분 타이머</title><style>
:root{color-scheme:dark;--bg:#171717;--fg:#f5f0df;--accent:#00b88a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif}button,select{font:inherit;color:inherit;background:#252525;border:1px solid #555;border-radius:12px;padding:12px 18px;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid var(--accent)}main{max-width:1200px;min-height:100svh;margin:auto;padding:24px 5vw;display:flex;flex-direction:column;gap:18px}header{display:flex;justify-content:space-between;align-items:center;color:#bbb7aa}header b{color:var(--fg)}.stage{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:330px}.label{font-size:clamp(22px,4vw,48px);font-weight:800;margin:0}.clock{font-size:clamp(88px,19vw,230px);font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums;letter-spacing:-.06em}.sub{font-size:clamp(18px,3vw,32px);min-height:1.5em;color:var(--accent)}.next{color:#bbb7aa;margin-top:16px}.progress{height:6px;background:#333;border-radius:4px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);width:0}nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}#go{background:var(--accent);color:#101010;border:0;font-weight:800;min-width:140px}.options{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.hint{text-align:center;font-size:13px;color:#aaa}details{border-top:1px solid #333;padding-top:12px}summary{cursor:pointer}ol{padding-left:24px;line-height:1.9}body.rest{--accent:#8cc8e8}body.done{--accent:#00b88a}@media(max-height:550px){main{padding:12px 4vw;gap:8px}.stage{min-height:180px}.clock{font-size:22vh}.next{margin:0}.hint{display:none}}
</style></head><body><main><header><b>오운랩</b><span id="total">남은 수업 50:00</span></header><div class="progress"><i id="bar"></i></div><section class="stage"><p class="label" id="label"></p><div class="clock" id="clock" role="timer"></div><div class="sub" id="sub"></div><div class="next" id="next"></div></section><nav><button id="prev" aria-label="이전 구간">이전</button><button id="go">시작</button><button id="nextBtn">다음</button></nav><div class="options"><select id="jump" aria-label="구간 선택"></select><button id="sound" aria-pressed="true">소리 켜짐</button><button id="test">소리 확인</button><button id="full">전체 화면</button><button id="reset">처음부터</button></div><details><summary>50분 시간 구성</summary><ol id="outline"></ol></details><p class="hint">스페이스 시작 / 일시정지　← → 구간 이동<br>화면을 켜둔 상태로 사용하세요. 중간 신호는 쉐도우 90초, 파트너 60초에 울립니다.</p></main><script>
'use strict';
const PLAN=[];let acc=0;
function add(section,label,duration,kind='work',mid=0){PLAN.push({section,label,duration,kind,mid,start:acc,end:acc+duration});acc+=duration;}
function transition(){add('전환','구간 전환',30,'rest');}
// Every duration includes only its own work/rest. No implicit end rests.
for(let i=1;i<=6;i++){add('워밍업','워밍업 '+i+'/6',20);add('워밍업','워밍업 '+i+'/6',20);}
transition();
for(let i=1;i<=2;i++){add('스탠스와 풋워크','풋워크 '+i+'/2R',180);if(i<2)add('스탠스와 풋워크','라운드 휴식',60,'rest');}
transition();
for(let i=1;i<=6;i++){add('쉐도우','쉐도우 '+i+'/6R',180,'work',90);if(i<6)add('쉐도우','라운드 휴식',60,'rest');}
transition();
for(let i=1;i<=2;i++){add('파트너','파트너 '+i+'/2R',120,'work',60);if(i<2)add('파트너','라운드 휴식',60,'rest');}
transition();
[[20,10,4],[30,15,2],[30,15,4]].forEach(([work,rest,count],block)=>{for(let i=1;i<=count;i++){add('컨디셔닝','인터벌 '+(block+1)+' / '+i+'세트',work);add('컨디셔닝','인터벌 휴식',rest,'rest');}});
transition();add('쿨다운','쿨다운',120);
const TOTAL=acc;if(TOTAL!==3000)throw Error('Schedule must total 3000 seconds');
const $=id=>document.getElementById(id),fmt=n=>{n=Math.max(0,Math.ceil(n));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');};
let elapsed=0,running=false,base=0,epoch=0,audio=null,sound=true,wake=null,prevElapsed=0,lastSaved=0;
const KEY='ownpace-timer-v7';
function at(t){return PLAN.findIndex(p=>t<p.end);}
function tone(freq=800,dur=.16){if(!sound||!audio)return;try{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.2,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur);}catch(e){}}
async function unlock(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();await audio.resume();}catch(e){}}
async function lock(){try{wake=await navigator.wakeLock.request('screen');}catch(e){}}
function release(){if(wake){wake.release().catch(()=>{});wake=null;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({elapsed,at:Date.now()}));}catch(e){}}
function syncTime(){if(running)elapsed=Math.min(TOTAL,base+(performance.now()-epoch)/1000);}
function render(){let k=at(elapsed),p=PLAN[k];document.body.className=!p?'done':p.kind==='rest'?'rest':'';$('label').textContent=p?p.section:'수업 완료';$('clock').textContent=p?fmt(p.end-elapsed):'00:00';$('sub').textContent=p?(p.mid?(elapsed-p.start<p.mid?'전반':'후반')+' / '+p.label:p.label):'50분 완료';$('total').textContent='남은 수업 '+fmt(TOTAL-elapsed);$('bar').style.width=(elapsed/TOTAL*100)+'%';$('next').textContent=p&&PLAN[k+1]?'다음 '+PLAN[k+1].section+' / '+PLAN[k+1].label:'오늘 수업 마무리';$('go').textContent=running?'일시정지':elapsed>=TOTAL?'완료':elapsed>0?'이어서':'시작';$('go').disabled=elapsed>=TOTAL;}
function pause(){syncTime();running=false;release();save();render();}
async function start(){if(running||elapsed>=TOTAL)return;await unlock();if(running)return;running=true;base=elapsed;epoch=performance.now();prevElapsed=elapsed;lock();tone();render();}
function move(t){syncTime();elapsed=Math.max(0,Math.min(TOTAL,t));base=elapsed;epoch=performance.now();prevElapsed=elapsed;if(elapsed===TOTAL){running=false;release();}save();render();}
function tick(){if(running){syncTime();let old=at(prevElapsed),now=at(elapsed);if(elapsed-prevElapsed<2){if(old!==now)tone(now<0?440:900,.5);else if(now>=0){const p=PLAN[now];if(p.mid&&prevElapsed<p.start+p.mid&&elapsed>=p.start+p.mid)tone(1200,.25);else if(Math.ceil(p.end-elapsed)<=3&&Math.ceil(p.end-elapsed)!==Math.ceil(p.end-prevElapsed))tone(650,.08);}}if(elapsed>=TOTAL){running=false;release();save();}if(performance.now()-lastSaved>1000){save();lastSaved=performance.now();}prevElapsed=elapsed;render();}requestAnimationFrame(tick);}
$('go').onclick=()=>running?pause():start();$('prev').onclick=()=>{syncTime();const k=at(elapsed);move(PLAN[Math.max(0,(k<0?PLAN.length:k)-1)].start);};$('nextBtn').onclick=()=>{syncTime();const k=at(elapsed);if(k>=0)move(PLAN[k+1]?.start??TOTAL);};
$('reset').onclick=()=>{if(elapsed>0&&!confirm('타이머를 처음으로 되돌릴까요?'))return;pause();move(0);};
$('sound').onclick=async()=>{sound=!sound;$('sound').textContent=sound?'소리 켜짐':'소리 꺼짐';$('sound').setAttribute('aria-pressed',String(sound));if(sound){await unlock();tone();}};
$('test').onclick=async()=>{await unlock();tone(900,.5);};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){$('full').textContent='전체 화면 미지원';}};
PLAN.forEach((p,i)=>{if(i===0||p.section!==PLAN[i-1].section){const o=document.createElement('option');o.value=p.start;o.textContent=fmt(p.start)+' '+p.section;$('jump').appendChild(o);}});$('jump').onchange=e=>move(Number(e.target.value));
[['워밍업','4분'],['스탠스와 풋워크','3분 × 2R / 사이 휴식 1분'],['쉐도우','3분 × 6R / 사이 휴식 1분'],['파트너','2분 × 2R / 사이 휴식 1분'],['컨디셔닝','20초/10초 × 4, 30초/15초 × 2, 30초/15초 × 4'],['쿨다운','2분'],['구간 전환','30초 × 5']].forEach(([s,t])=>{const li=document.createElement('li');li.textContent=s+' — '+t;$('outline').appendChild(li);});
document.addEventListener('keydown',e=>{if(['BUTTON','SELECT','INPUT'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();running?pause():start();}if(e.key==='ArrowRight')$('nextBtn').click();if(e.key==='ArrowLeft')$('prev').click();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&running)lock();});window.addEventListener('pagehide',()=>{syncTime();save();});
try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Date.now()-v.at<7200000&&Number.isFinite(v.elapsed))elapsed=Math.max(0,Math.min(TOTAL,v.elapsed));}catch(e){}
render();requestAnimationFrame(tick);
</script></body></html>
