<title>오운랩 라운드 타이머</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
/* Layout: a TV seen from 3–5 m. Whole-class strip on top, today's move dominant in the middle, next move callout below, controls hide while running. */
:root{
  --cream:#F5F0DF; --ink:#171717; --green:#009F73; --sand:#D9D0B8; --mint:#DCEFE6; --warn:#E8553B;
  --bg:var(--cream); --fg:var(--ink); --muted:#5f594a; --track:var(--sand); --fill:var(--green); --tag:var(--green); --tagfg:var(--cream); --panel:#ece5cf;
  --f-num:"Oswald","Arial Narrow",system-ui,sans-serif;
  --f-disp:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,sans-serif;
  --f-head:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  color-scheme:light;
}
body.t-up{--bg:var(--green);--fg:var(--cream);--muted:#d7f2e7;--track:#0d7f5d;--fill:var(--cream);--tag:var(--cream);--tagfg:var(--green);--panel:#0c8b65}
body.t-rest{--bg:#D7ECF8;--fg:#0E3A52;--muted:#3E6A82;--track:#B7D9EC;--fill:#1F7FB4;--tag:#1F7FB4;--tagfg:#F5FBFF;--panel:#C6E2F2}
body.t-talk,body.t-finish{--bg:var(--ink);--fg:var(--cream);--muted:#b4ad9e;--track:#333;--fill:var(--green);--tag:var(--green);--tagfg:var(--cream);--panel:#262626;color-scheme:dark}
body.t-cool{--bg:var(--mint);--fg:#0f3d30;--muted:#40695b;--track:#bfdccf;--fill:var(--green);--tag:var(--green);--tagfg:var(--cream);--panel:#cbe6da}

[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);transition:background .35s,color .35s;overflow:hidden}
.wrap{height:100%;box-sizing:border-box;display:grid;grid-template-rows:auto 1fr;gap:clamp(6px,1.2vh,14px);padding-block:clamp(10px,2.4vh,28px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec{font-family:var(--f-head);font-weight:900;font-size:clamp(18px,2.6vw,38px);letter-spacing:-.01em;display:flex;align-items:baseline;gap:.5em}
.sec span{font-family:var(--f-num);font-weight:500;font-size:.85em;color:var(--muted);font-variant-numeric:tabular-nums}
.stats{font-family:var(--f-num);font-size:clamp(16px,2.2vw,32px);font-variant-numeric:tabular-nums;color:var(--muted)}
.stats b{color:var(--fg)}
@media (max-width:480px){ .stats .brand{display:none} header{flex-wrap:nowrap} }

/* ===== Layout =====
   간격은 세 단계만 쓴다: --s1 붙여서(태그→동작, 동작→보조 문구) · --s2 묶어서(동작→박스) · 나눠서(다음 예고는 항상 맨 아래 같은 자리)
   phone(세로): 가운데 정렬로 쌓기. wide(TV·노트북): 왼쪽 = 할 것, 오른쪽 = 숫자, 아래 = 다음 */
main{--fit:1;--s1:calc(clamp(4px,1.1vh,14px)*var(--fit));--s2:calc(clamp(10px,2.6vh,34px)*var(--fit));
  display:grid;grid-template-columns:1fr;grid-template-rows:1fr auto auto 1fr auto;grid-template-areas:"." "info" "num" "." "next";
  justify-items:center;row-gap:var(--s2);min-height:0;overflow:hidden;text-align:center;padding-bottom:clamp(44px,7vh,64px)}
.info{grid-area:info;display:flex;flex-direction:column;align-items:center;min-width:0;max-width:100%}
.info .tag{margin-bottom:var(--s1)}
.info .who{margin-top:var(--s1)}
.info .beats{margin-top:var(--s2)}
@media (min-width:640px) and (min-aspect-ratio:5/4){
  /* TV는 가장자리가 잘리거나(오버스캔) 멀리서 보면 붙어 보인다: 화면 테두리 4vw, 내용은 3vw 더 안쪽 */
  .wrap{padding-left:max(4vw,env(safe-area-inset-left,0px));padding-right:max(4vw,env(safe-area-inset-right,0px))}
  /* 크기 위계: 동작(문구+박스) > 숫자 > 다음 > 보조 문구 > 기본/레벨업(배경색이 이미 알려줌) */
  main{padding:0 1vw clamp(8px,2vh,24px) 3vw;grid-template-columns:minmax(0,1.85fr) minmax(0,1fr);grid-template-rows:1fr auto;grid-template-areas:"info num" "next next";
    align-items:center;justify-items:start;text-align:left;column-gap:3vw;row-gap:0}
  .info{align-items:flex-start}
  .move{font-size:calc(clamp(38px,8.4vw,172px)*var(--fit))!important;max-width:100%!important;line-height:1.05}
  .tag{font-size:clamp(15px,1.6vw,32px)!important;padding:.3em .8em!important}
  .who{font-size:calc(clamp(16px,2.3vw,46px)*var(--fit))!important}
  .beats{font-size:calc(clamp(17px,3.3vw,66px)*var(--fit))!important}
  .num{justify-self:center;font-size:calc(min(40vh,17vw)*var(--fit))!important}
  .next{font-size:clamp(15px,1.8vw,36px)!important;margin-left:-.8em;transform-origin:left center}
}
.tag{font-family:var(--f-head);font-weight:900;font-size:clamp(22px,3.4vw,52px);line-height:1;display:inline-flex;align-items:center;justify-content:center;background:var(--tag);color:var(--tagfg);padding:.32em .95em;border-radius:99px}
.move .seg,.who .seg{white-space:nowrap}
.move{font-family:var(--f-head);font-weight:900;letter-spacing:-.02em;font-size:calc(clamp(40px,9vw,160px)*var(--fit));line-height:1.08;text-wrap:balance;max-width:94vw;word-break:keep-all;overflow-wrap:anywhere}
/* beat boxes: one box = one beat, 4 per line, at most 2 lines. 왼 = filled, 오 = outline, 가드 = faint, arrow = dashed (moving) */
.beats{display:flex;flex-direction:column;gap:.16em;font-size:calc(clamp(17px,5.8vw,40px)*var(--fit))}
.beats:empty{display:none}
.beats .ln:nth-child(2):not(:last-child){margin-bottom:.35em} /* 16박(앞뒤 루틴)은 8박씩 두 덩어리로 보이게 */
.beats .ln{display:grid;grid-template-columns:repeat(4,3.3em);gap:.14em}
.beats .c{height:2.25em;border-radius:.4em;display:flex;align-items:center;justify-content:center;box-sizing:border-box;font-family:var(--f-head);font-weight:900;letter-spacing:-.02em;overflow:hidden}
.beats .L{background:var(--fg);color:var(--bg)}
.beats .R{border:.12em solid var(--fg);color:var(--fg)}
.beats .G{background:color-mix(in srgb,var(--fg) 10%,transparent);color:color-mix(in srgb,var(--fg) 55%,transparent);font-weight:700;font-size:.72em;height:3.125em;border-radius:.555em}
.beats .M{border:.1em dashed color-mix(in srgb,var(--fg) 60%,transparent);color:var(--fg);font-size:1.2em;height:1.875em;border-radius:.333em}
.beats .two{font-size:.84em;height:2.68em;border-radius:.476em}
.beats .mix{border:.12em solid var(--fg);padding:0}
.beats .mix i{flex:1;height:100%;display:grid;place-items:center;font-style:normal;color:var(--fg)}
.beats .mix i.L{background:var(--fg);color:var(--bg)}
.who{max-width:100%;font-size:calc(clamp(17px,4.4vw,40px)*var(--fit));font-weight:700;color:color-mix(in srgb,var(--fg) 78%,transparent);line-height:1.3;word-break:keep-all}
.who:empty{display:none}
.num{grid-area:num;font-family:var(--f-num);font-weight:700;font-size:calc(min(24vh,34vw)*var(--fit));line-height:.9;font-variant-numeric:tabular-nums}
main .num.mmss{font-size:calc(min(24vh,17vw)*var(--fit))}
@media (min-width:640px) and (min-aspect-ratio:5/4){ main .num.mmss{font-size:calc(min(28vh,11vw)*var(--fit))!important} }
/* 마무리·수업 끝: 숫자 대신 유튜브·카톡 채널 QR (오운랩 유튜브 @ownpacelab, 카톡 채널 pf.kakao.com/_xfrAFX) */
.links{grid-area:num;display:grid;grid-template-columns:1fr 1fr;gap:calc(clamp(16px,4.5vw,96px)*var(--fit));justify-self:center}
.links[hidden]{display:none}
.lk{display:flex;flex-direction:column;align-items:center;gap:.25em;background:var(--cream);color:var(--ink);border-radius:.8em;padding:.8em .8em .7em;font-size:calc(clamp(12px,1.5vw,30px)*var(--fit));text-align:center;word-break:keep-all}
.lk svg{width:calc(min(32vh,15vw)*var(--fit));height:auto;fill:var(--ink);display:block;margin-bottom:.3em}
.lk b{font-family:var(--f-head);font-weight:900;font-size:1.05em;line-height:1.2}
.lk b{font-size:1.3em}
.lk span{font-weight:700;font-size:.95em}
.lk em{font-style:normal;font-weight:700;color:#5f594a;font-size:.85em;margin-top:.15em}
/* QR 화면: 멀리서도 찍히게 QR을 가장 크게, 문구는 줄인다 */
@media (min-width:640px) and (min-aspect-ratio:5/4){
  body.qrmode main{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  body.qrmode .move{font-size:calc(clamp(32px,6vw,120px)*var(--fit))!important}
  body.qrmode .lk svg{width:calc(min(44vh,19vw)*var(--fit))}
}
@media not ((min-width:640px) and (min-aspect-ratio:5/4)){ .lk svg{width:calc(min(24vh,36vw)*var(--fit))} .lk{font-size:calc(clamp(12px,3.4vw,20px)*var(--fit))} }
body.warn .num{color:var(--warn);animation:pulse 1s ease-out infinite}
body.t-up.warn .num{color:var(--ink)}
@keyframes pulse{0%{transform:scale(1.08)}100%{transform:scale(1)}}

.next{grid-area:next;font-family:var(--f-head);font-weight:700;font-size:clamp(17px,4.2vw,42px);color:var(--muted);padding:.35em .8em;border-radius:99px;transition:background .25s,color .25s,transform .25s;max-width:90vw;word-break:keep-all}
.next b{color:var(--fg);font-weight:900}
.next:empty{visibility:hidden}
/* 8초 전: '다음' 띠를 크게 반전해 강조 (지금 동작 글씨의 약 2/3) */
body.soon .next{background:var(--fg);color:var(--bg);font-size:calc(clamp(22px,6.4vw,52px)*var(--fit))!important;padding:.3em .75em;animation:nextPulse 1s ease-in-out infinite}
body.soon .next b{color:var(--bg)}
@media (min-width:640px) and (min-aspect-ratio:5/4){ body.soon .next{font-size:calc(clamp(24px,4.4vw,88px)*var(--fit))!important;margin-left:-.4em} }
@keyframes nextPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--fg) 45%,transparent)}50%{box-shadow:0 0 0 .18em color-mix(in srgb,var(--fg) 25%,transparent)}}

.paused{position:fixed;inset:0;display:flex;flex-direction:column;gap:.3em;align-items:center;justify-content:center;background:var(--bg);font-family:var(--f-head);font-weight:900;letter-spacing:-.02em;font-size:clamp(44px,9vw,140px);color:var(--fg);cursor:pointer}
.paused small{font-family:var(--f-body);font-weight:700;font-size:.24em;color:var(--muted);letter-spacing:0}

footer{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;gap:6px;transition:opacity .6s;z-index:4}
footer button{font-size:13px;padding:.6em .9em;opacity:.75}
footer button.main{min-width:0;opacity:1}
button{font:700 clamp(13px,1.5vw,19px)/1 var(--f-body);padding:.75em 1.2em;border-radius:99px;border:2px solid var(--fg);background:transparent;color:var(--fg);cursor:pointer}
button.main{background:var(--fg);color:var(--bg);min-width:8em}
button:focus-visible{outline:3px solid var(--warn);outline-offset:3px}
body.hide footer{opacity:0;pointer-events:none}
body.hide{cursor:none}

/* section menu */
.menu{position:fixed;inset:0;background:var(--ink);color:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;overflow-y:auto;padding-block:24px;padding-inline:16px;z-index:5}
.menu h2{font-family:var(--f-head);font-weight:900;font-size:clamp(24px,3vw,40px);margin:0}
.menu .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;width:min(960px,100%)}
.menu .grid button{border-color:#555;color:var(--cream);text-align:left;border-radius:14px;padding:.85em 1em;display:flex;flex-direction:column;align-items:flex-start;gap:.35em;word-break:keep-all;line-height:1.25}
.menu .grid button span{font-family:var(--f-num);color:#9c968a;font-weight:500}
.menu .grid button.cur{border-color:var(--green);background:var(--green)}
.menu .grid button.cur span{color:var(--cream)}
.menu .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.menu .row button{border-color:#777;color:var(--cream)}
.menu .keys{margin:0;font-size:14px;line-height:1.6;color:#b4ad9e;text-align:center}
.menu .close{border-color:var(--cream);color:var(--cream);min-width:10em}
.menu .row button.on{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.menu .row button.arm{background:var(--warn);border-color:var(--warn);color:#fff}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--cream);font:700 clamp(15px,1.8vw,22px)/1.3 var(--f-body);padding:.75em 1.3em;border-radius:99px;z-index:9;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:90vw;text-align:center}
@media (prefers-reduced-motion:reduce){body.soon .next{animation:none}body.warn .num{animation:none}body,.next{transition:none}}
</style>

    <div class="sec" id="sec">인사</div>

function renderBuf(len,draw){ const OC=window.OfflineAudioContext||window.webkitOfflineAudioContext; if(!OC) return Promise.reject();
  const oc=new OC(1,Math.ceil(SR*len),SR); draw(oc,chain(oc,1));
  return new Promise((ok,no)=>{ oc.oncomplete=e=>ok(e.renderedBuffer); const pr=oc.startRendering(); if(pr&&pr.then) pr.then(ok,no); }); }
const CLIPS={}, CLIP_LEVEL={soft:.6};   // 쿨다운 땡만 조금 작게. 톡·땡땡은 최대
async function renderAll(){ for(const k in SOUNDS){ try{ const url=toWav(await renderBuf(...SOUNDS[k]),VOLS[vol]*(CLIP_LEVEL[k]||1));
  const a=CLIPS[k]||new Audio(); a.src=url; a.preload='auto'; a.setAttribute('playsinline',''); CLIPS[k]=a; }catch(e){} } }
renderAll();
let liveOut=null;
// 한 폰 모드: 다른 앱 음악(유튜브 뮤직 등)을 끊지 않도록 실시간 소리만 쓰고, 다른 소리와 섞어서 재생
let mixMode=false; try{ mixMode=localStorage.getItem('ownpace-mix')==='1'; }catch(e){}
// 음성 안내(기본 꺼짐): 8초 전에 '다음, 동작'을 한 번 읽는다. 기기에 있는 한국어 음성 중 자연스러운 것을 고른다
let voiceOn=false; try{ voiceOn=localStorage.getItem('ownpace-voice')==='1'; }catch(e){}
let koVoice=null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang)); const pref=['Yuna','유나','Google 한국','Sora','Heami','Jihun','Microsoft']; 
  koVoice=pref.map(p=>vs.find(v=>v.name.includes(p))).find(Boolean)||vs[0]||null; }catch(e){} }
try{ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }catch(e){}
// 소리(종)를 꺼도 음성은 나온다: 코치 폰 = 소리 끔 + 음성 켬
function say(t){ if(!voiceOn) return; try{ duckU=null; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t.replace(/,/g,' ')); u.lang='ko-KR'; if(koVoice) u.voice=koVoice; u.rate=1; u.pitch=1; u.volume=1; speechSynthesis.speak(u); }catch(e){} }
let warned=false;
function blockedHint(){ if(warned) return; warned=true; toast('소리가 안 나면 화면을 한 번 누르고, 기기 음량과 무음 모드를 확인해 주세요'); }
// 음악과 함께 모드: 종·톡이 날 때 음악을 잠깐 줄인다(음성 안내처럼). 소리 없는 음성으로 아이폰의 '음악 줄이기'를 켜고, 마지막 소리 2.5초 뒤 되돌린다
let duckU=null, duckT=0;
function duck(){ try{ if(navigator.audioSession) navigator.audioSession.type='transient'; }catch(e){}
  try{ if(!duckU&&!speechSynthesis.speaking){ const u=new SpeechSynthesisUtterance('음 '.repeat(40)); u.lang='ko-KR'; u.volume=0; u.rate=.5; u.onend=()=>{ if(duckU===u) duckU=null; }; duckU=u; speechSynthesis.speak(u); } }catch(e){}
  clearTimeout(duckT); duckT=setTimeout(unduck,2500); }
function unduck(){ try{ if(duckU){ duckU=null; speechSynthesis.cancel(); } }catch(e){} try{ if(navigator.audioSession) navigator.audioSession.type='ambient'; }catch(e){} }
function primeSpeech(){ try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); }catch(e){} }
function play(k){ if(!sound) return; if(mixMode){ duck(); liveRing(k); return; } const a=CLIPS[k];
  if(a){ try{ a.muted=false; a.volume=1; a.currentTime=0; const pr=a.play(); if(pr&&pr.catch) pr.catch(()=>{ liveRing(k); if(!ctx||ctx.state!=='running') blockedHint(); }); return; }catch(e){} }
  liveRing(k); }
function liveRing(k){ if(!ctx){ blockedHint(); return; } if(!liveOut) liveOut=chain(ctx); liveOut.gain.value=1.5+2.5*VOLS[vol]; liveOut.out.gain.value=.9*VOLS[vol]; try{ const t=ctx.currentTime; // live fallback
  if(k==='tick') synthTick(ctx,liveOut,t+.01); else if(k==='bell') [0,.16,.32].forEach(d=>synthStrike(ctx,liveOut,t+.01+d)); else if(k==='ding') [0,.22].forEach(d=>synthStrike(ctx,liveOut,t+.01+d)); else synthStrike(ctx,liveOut,t+.01,k==='soft'?.45:1); }catch(e){} }
const bell=()=>play('bell'), ding=()=>play('ding'), soft=()=>play('soft'), countTick=()=>play('tick');
// 박자판 그리기: '가드' = 쉬는 박, 화살표 = 이동, 왼/오 = 손(한 칸에 두 손이면 한 박에 두 번)
function cell(t){
  if(t==='가드') return '<div class="c G">가드</div>';
  if(/^[↑↓←→]$/.test(t)) return `<div class="c M">${t}</div>`;
  const hs=[...t]; if(hs.length===1) return `<div class="c ${t==='왼'?'L':'R'}">${t}</div>`;
  if(hs.every(x=>x===hs[0])) return `<div class="c two ${hs[0]==='왼'?'L':'R'}">${t}</div>`;
  return '<div class="c two mix">'+hs.map(x=>`<i class="${x==='왼'?'L':'R'}">${x}</i>`).join('')+'</div>'; }
const beats=b=>b?b.split(' / ').map(l=>'<div class="ln">'+l.split(' ').map(cell).join('')+'</div>').join(''):'';
const stepAt=t=>{ for(let i=PLAN.length-1;i>=0;i--) if(t>=PLAN[i].start) return i; return 0; };
const nextLabel=(n,s)=>n.move+(s&&s.sec===n.sec&&s.move===n.move&&s.hands===n.hands?' 한 번 더':''); // 기본/레벨업은 배경색이 알려주니 '다음'에는 동작만. 같은 동작이 이어지면 '한 번 더'

// shrink the big text until everything fits on one screen (TV, laptop, phone)
let lastFit=-1, lastSoon=false, saidStep=-1;
function fit(){ const m=document.querySelector('main'); let f=1; m.style.setProperty('--fit','1'); releaseLongSegs();
  while((m.scrollHeight>m.clientHeight+1||m.scrollWidth>m.clientWidth+1)&&f>.45){ f-=.05; m.style.setProperty('--fit',f.toFixed(2)); } }
window.addEventListener('resize',()=>{ lastFit=-1; render(); });
document.addEventListener('fullscreenchange',()=>{ lastFit=-1; render(); });
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ lastFit=-1; render(); });
// 동작 문구 줄바꿈: 쉼표 뒤나 '+' 앞에서만 줄을 바꾼다 ('옆으로 한 / 발'처럼 말 덩어리가 깨지지 않게)
// 한 덩어리가 칸보다 길면(예: 반대 손으로 무릎 터치) 그 덩어리만 띄어쓰기에서 줄을 바꾼다
let moveText=null;
function setMove(t){ if(t===moveText) return; moveText=t; lastFit=-1; const m=$('move');
  m.innerHTML=t.split(/(?<=,)\s+|\s+(?=\+\s)/).map(x=>'<span class="seg">'+x.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</span>').join(' ');
  m.style.removeProperty('--fit'); }
function releaseLongSegs(){ const m=$('move'); m.querySelectorAll('.seg').forEach(x=>{ x.style.whiteSpace=''; if(x.offsetWidth>m.clientWidth+1) x.style.whiteSpace='normal'; }); }
function render(){
  const i=stepAt(elapsed), s=PLAN[i], inS=elapsed-s.start, left=s.dur-inS, n=PLAN[i+1];
  const late=s.late&&left<=s.late.at;
  const done=elapsed>=TOTAL-0.01;
  const soon=running&&n&&!done&&left<=8&&s.type!=="talk"; // 8초 전에 다음을 강조: 코치가 미리 말할 시간
  const cls=['t-'+s.type]; if(running&&left<=4&&s.type!=='talk') cls.push('warn'); if(soon) cls.push('soon'); if(document.body.classList.contains('hide')) cls.push('hide');
  document.body.className=cls.join(' ');
  $('sec').innerHTML=nm(s.sec)+(s.mins?`<span>${s.min+1}/${s.mins}</span>`:'');
  const intro=!started&&elapsed===0; // 시작 화면은 맨 처음에서만. 시작 전에 이전/다음으로 옮기면 그 구간을 미리 보여준다
  $('tag').textContent=intro?'내 페이스 복싱':done?'수업 끝':(s.qr&&s.type==='rest'?s.tag+' · '+Math.max(1,Math.ceil(left))+'초':s.tag); // QR 물 시간도 남은 초가 보이게
  setMove(late?s.late.move:s.move);
  $('beats').innerHTML=beats(s.hands);
  const whoT=intro?'처음이어도 괜찮아요':done?'다음 주에도, 내 페이스로':late?'':(s.sub||''); // ' · '로 나뉜 덩어리는 중간에서 줄이 바뀌지 않게
  $('who').innerHTML=whoT.split(' · ').map(x=>'<span class="seg">'+x.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</span>').join(' · ');
  if(intro) setMove('오늘은 나를 위한 50분');
  if(done){ setMove('오늘 해냈어요!'); $('beats').innerHTML=''; }
  // 8초 전: 큰 화면은 끝까지 '지금 동작'. 아래 '다음' 띠만 크게 반전해 강조(코치는 읽고 미리 말하고, 회원은 숫자가 끝나면 바꾼다)
  if(soon!==lastSoon){ lastSoon=soon; lastFit=-1; }
  // 음성(코치 이어폰용): 같은 구간 안은 8초 전 '다음, 동작'. 구간이 바뀔 땐 12초 전 '다음은 구간. 첫 동작'.
  // 주먹 인사가 있는 칸은 10초 전에 '짝과 주먹 인사'부터 알리고 다음 동작을 이어서 말한다.
  if(n&&!done){ const newSec=n.sec!==s.sec, vAt=s.late?s.late.at:newSec?12:8;
    if(left>vAt+.5&&saidStep===i) saidStep=-1;
    if(running&&left<=vAt&&saidStep!==i){ saidStep=i; const nx=newSec?'다음은 '+nm(n.sec)+'. '+n.move:'다음, '+nextLabel(n,s); say(s.late?s.late.move+'. '+nx:nx); } }
  const qr=!intro&&!!(done||s.qr); // 꼭 true/false로(undefined면 toggle이 매 프레임 뒤집힘)
  $('links').hidden=!qr; $('num').hidden=qr; document.body.classList.toggle('qrmode',qr); // 마무리 3분은 남은 시간보다 채널 안내가 중요
  $('num').textContent=done?'':left>60?fmt(left):Math.max(1,Math.ceil(left));
  $('num').classList.toggle('mmss',!done&&left>60); // 1:40 처럼 긴 숫자는 칸을 넘지 않게 조금 작게
  $('total').textContent=fmt(elapsed);
  $('next').innerHTML=done||!n?'':'다음 · <b>'+(n.sec!==s.sec?'<span style="white-space:nowrap">'+nm(n.sec)+'</span> · <span style="white-space:nowrap">'+nextLabel(n)+'</span>':nextLabel(n,s))+'</b>';
  if(i!==lastFit){ lastFit=i; fit(); }
  if(!running) return;
  if(i!==lastStep){ if(lastStep!==-1){ if(s.type==='cool') soft(); else if(PLAN[lastStep].sec!==s.sec) bell(); else ding(); } lastStep=i; }
  const tick=Math.floor(elapsed);
  if(tick!==lastTick){ lastTick=tick; wakeAudio(); const l=Math.ceil(s.dur-(tick-s.start));
    if(l<=4&&l>=1&&s.type!=='talk'&&s.type!=='cool') countTick(); }   // 마지막 4초 톡 4번 = 코치 '넷, 셋, 둘, 하나'
}
function save(){ try{ localStorage.setItem('ownpace-timer',JSON.stringify({elapsed,at:Date.now()})); }catch(e){} }
function loop(t){ if(!running) return; elapsed+=(t-last)/1000; last=t;
  if(elapsed>=TOTAL){ elapsed=TOTAL-0.001; pause(); $('paused').hidden=true; bell(); $('go').textContent='끝'; return; }
  if(t-saveT>2000){ saveT=t; save(); }
  render(); requestAnimationFrame(loop); }
// ===== Audio unlock: must run inside a tap/click =====
function unlockAudio(skip=[]){
  try{ if(navigator.audioSession) navigator.audioSession.type=mixMode?'ambient':'playback'; }catch(e){}
  if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  try{ ctx&&ctx.resume&&ctx.resume(); }catch(e){}
  if(mixMode) return;
  for(const k in CLIPS){ if(skip.includes(k)) continue; const a=CLIPS[k];
    try{ a.muted=true; const pr=a.play(); if(pr&&pr.then) pr.then(()=>{ if(a.muted){ a.pause(); a.currentTime=0; a.muted=false; } }).catch(()=>{ a.muted=false; }); }catch(e){} }
}
function wakeAudio(){ if(ctx&&ctx.state!=='running'){ try{ ctx.resume(); }catch(e){} } }
async function start(){
  primeSpeech();   // 아이폰: 음성은 탭 안에서 한 번 깨워야 이후에도 나온다
  unlockAudio(started?[]:['bell']);
  if(!started){ started=true; bell(); }
  lastStep=stepAt(elapsed);
  running=true; last=performance.now(); $('paused').hidden=true; $('go').textContent='일시정지';
  requestAnimationFrame(loop);
  try{ wake=await navigator.wakeLock.request('screen'); }catch(e){}
  autoHide();
}
function pause(){ running=false; $('go').textContent='계속'; if(started) $('paused').hidden=false; save(); render(); document.body.classList.remove('hide'); try{wake&&wake.release();}catch(e){} }
function sync(){ lastStep=stepAt(elapsed); lastTick=-1; save(); render(); }
function jump(d){ const i=Math.min(PLAN.length-1,Math.max(0,stepAt(elapsed)+d)); elapsed=PLAN[i].start; sync(); }
function again(){ const sec=PLAN[stepAt(elapsed)].sec; elapsed=SECTIONS.find(s=>s.sec===sec).start; sync(); }
function reset(){ running=false; started=false; elapsed=0; $('paused').hidden=true; $('go').textContent='시작'; try{localStorage.removeItem('ownpace-timer');}catch(e){} sync(); }
const toggle=()=>running?pause():start();
function openMenu(){ const cur=PLAN[stepAt(elapsed)].sec; [...$('grid').children].forEach((b,k)=>b.classList.toggle('cur',SECTIONS[k].sec===cur)); $('menu').hidden=false; document.body.classList.remove('hide'); }
function closeMenu(){ $('menu').hidden=true; }
let toastT; function toast(msg){ const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2200); }
function setLabels(){ $('snd').textContent='소리: '+(sound?'켜짐':'꺼짐'); $('snd').classList.toggle('on',sound); $('vol').textContent='소리 크기: '+vol; $('voice').textContent='음성 안내: '+(voiceOn?'켜짐':'꺼짐'); $('voice').classList.toggle('on',voiceOn);
  $('mix').textContent='음악과 함께: '+(mixMode?'켜짐':'꺼짐'); $('mix').classList.toggle('on',mixMode);
  $('fs').textContent=document.fullscreenElement?'전체화면 끄기':'전체화면'; }
function fullscreen(){ const d=document; try{ d.fullscreenElement?d.exitFullscreen():d.documentElement.requestFullscreen().catch(()=>{}); }catch(e){} }
function autoHide(){ document.body.classList.remove('hide'); clearTimeout(hideT); if(running) hideT=setTimeout(()=>document.body.classList.add('hide'),3000); }

$('go').onclick=toggle; $('fs').onclick=()=>{ fullscreen(); closeMenu(); };
let resetArm=null;
$('reset').onclick=()=>{ const b=$('reset');
  if(!resetArm){ b.classList.add('arm'); b.textContent='한 번 더 누르면 처음부터'; resetArm=setTimeout(()=>{ resetArm=null; b.classList.remove('arm'); b.textContent='수업 처음부터'; },3000); return; }
  clearTimeout(resetArm); resetArm=null; b.classList.remove('arm'); b.textContent='수업 처음부터'; reset(); closeMenu(); toast('처음으로 돌아왔어요 · 시작을 누르세요'); };
$('prev').onclick=()=>jump(-1); $('nextBtn').onclick=()=>jump(1); $('again').onclick=()=>{ again(); closeMenu(); toast(nm(PLAN[stepAt(elapsed)].sec)+' 처음으로 이동했어요'); };
$('list').onclick=openMenu; $('close').onclick=closeMenu; $('paused').onclick=start;
$('mix').onclick=()=>{ mixMode=!mixMode; try{ localStorage.setItem('ownpace-mix',mixMode?'1':'0'); }catch(e){}
  for(const k in CLIPS){ try{ CLIPS[k].pause(); }catch(e){} } setLabels(); unlockAudio(); ding();
  toast(mixMode?'음악과 함께 켜짐 · 유튜브 뮤직을 끊지 않아요':'음악과 함께 꺼짐 · 수업용 기본 소리'); };
$('vol').onclick=async()=>{ const order=['작게','보통','크게']; vol=order[(order.indexOf(vol)+1)%3]; try{ localStorage.setItem('ownpace-vol',vol); }catch(e){}
  setLabels(); await renderAll(); sound=true; setLabels(); unlockAudio(['ding']); ding(); toast('소리 크기 '+vol+' · 땡 소리를 들어 보세요'); };
$('voice').onclick=()=>{ voiceOn=!voiceOn; try{ localStorage.setItem('ownpace-voice',voiceOn?'1':'0'); }catch(e){} setLabels(); pickVoice();
  if(voiceOn) say('음성 안내를 켰어요. 다음 동작을 미리 알려 드려요'); toast(voiceOn?'음성 안내 켜짐 · '+(koVoice?koVoice.name:'기본 음성'):'음성 안내 꺼짐'); };
$('snd').onclick=()=>{ sound=!sound; setLabels(); if(sound){ unlockAudio(['ding']); ding(); } toast(sound?'소리 켜짐 · 땡 소리가 났나요?':'소리 꺼짐'); };
document.addEventListener('fullscreenchange',setLabels);
setLabels();
document.addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='Escape'&&!$('menu').hidden){ closeMenu(); return; }
  if(e.code==='Space'||k==='Enter'||k==='.'||k==='b'||k==='B'){ if(e.target.tagName==='BUTTON'&&k==='Enter') return; e.preventDefault(); toggle(); }
  else if(k==='ArrowRight'||k==='PageDown'){ e.preventDefault(); jump(1); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); jump(-1); }
  else if(k==='Home') again();
  else if(k==='l'||k==='L') $('menu').hidden?openMenu():closeMenu();
  else if(k==='r'||k==='R') reset(); else if(k==='f'||k==='F') fullscreen();
  autoHide();
});
['mousemove','pointerdown'].forEach(ev=>document.addEventListener(ev,autoHide,{passive:true}));
document.addEventListener('pointerdown',()=>{ if(running) unlockAudio(['bell','ding','soft','tick']); },{passive:true});
document.addEventListener('visibilitychange',async()=>{ if(running&&document.visibilityState==='visible'){ wakeAudio(); try{wake=await navigator.wakeLock.request('screen');}catch(e){} } });

// resume after an accidental reload (within 2 hours)
try{ const v=JSON.parse(localStorage.getItem('ownpace-timer')||'null');
  if(v&&v.elapsed>1&&v.elapsed<TOTAL&&Date.now()-v.at<7200000){ elapsed=v.elapsed; started=true; $('go').textContent=`이어서 (${fmt(elapsed)})`; } }catch(e){}
render();
</script>

</body></html>
