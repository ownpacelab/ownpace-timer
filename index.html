function transition(){add('전환','구간 전환',30,'rest');}

transition();add('쿨다운','쿨다운',120);

function playClip(key,delay=0,isVoice=false){if(!sound||!audio||audio.state!=='running'||!buffers[key])return false;const source=audio.createBufferSource(),gain=audio.createGain();source.buffer=buffers[key];gain.gain.value=volume;source.connect(gain);gain.connect(audio.destination);source.onended=()=>{source.disconnect();gain.disconnect();if(voiceSource===source)voiceSource=null;};source.start(audio.currentTime+delay);if(isVoice)voiceSource=source;return true;}
function bell(){playClip('bell');}
function warning(){playClip('warning');}
function tone(freq=1200,dur=.25){if(!sound||!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;o.type='triangle';g.gain.setValueAtTime(0,audio.currentTime);g.gain.linearRampToValueAtTime(volume*.5,audio.currentTime+.005);g.gain.setValueAtTime(volume*.5,audio.currentTime+dur-.03);g.gain.linearRampToValueAtTime(0,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur);}
function roundInfo(p){if(!p||p.section==='전환'||p.section==='쿨다운')return null;const works=PLAN.filter(x=>x.section===p.section&&x.kind==='work');if(p.section==='워밍업'){const n=Number(p.label.match(/(\d+)\//)[1]);return {n,total:6,completed:Math.floor(works.filter(x=>x.end<=elapsed).length/2)};}return {n:Math.max(1,works.filter(x=>x.start<=p.start).length),total:works.length,completed:works.filter(x=>x.end<=elapsed).length};}
function say(text){stopVoice();if(!sound||!voice)return;if(!playClip(text,1.8,true))$('audioStatus').textContent='음성 준비가 필요합니다. 음성 안내 미리 듣기를 눌러 주세요.';}
function announce(k,previous=-1){const p=PLAN[k],before=PLAN[previous];if(!p){say('수업 완료. 수고하셨습니다.');return;}if(p.section==='전환'){say('다음 운동 준비');return;}if(p.kind==='rest'){if(p.label==='라운드 휴식')say('휴식');return;}const r=roundInfo(p),oldRound=roundInfo(before);const newSection=!before||before.section!==p.section;const section=p.section==='스탠스와 풋워크'?'풋워크':p.section;if(newSection)say(section+' 시작'+(r?'. '+r.n+' 라운드':''));else if(r&&(!oldRound||oldRound.n!==r.n))say(r.n+' 라운드');}
async function unlock(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();const resumed=audio.resume();if(!preparing)preparing=Promise.all(Object.entries(CLIPS).map(async([key,data])=>{const raw=atob(data.split(',')[1]);const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));buffers[key]=await audio.decodeAudioData(bytes.buffer);})).catch(e=>{preparing=null;throw e;});await resumed;await preparing;if(audio.state!=='running')throw Error('Audio suspended');$('audioStatus').textContent='벨과 안내 음성 준비 완료';return true;}catch(e){$('audioStatus').textContent='소리를 시작하지 못했습니다. 다시 미리 듣기를 눌러 주세요.';return false;}}
async function lock(){try{wake=await navigator.wakeLock.request('screen');}catch(e){}}
function release(){if(wake){wake.release().catch(()=>{});wake=null;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({elapsed,at:Date.now()}));}catch(e){}}
function syncTime(){if(running)elapsed=Math.min(TOTAL,base+(performance.now()-epoch)/1000);}
function render(){let k=at(elapsed),p=PLAN[k];document.body.className=!p?'done':p.kind==='rest'?'rest':'';$('label').textContent=p?p.section:'수업 완료';if(p&&p.end-elapsed<=3&&running)document.body.className+=' ending';const ri=roundInfo(p);$('roundLabel').textContent=ri?'ROUND '+ri.n+' / '+ri.total:'';$('completed').textContent=ri?ri.completed+' / '+ri.total+' 라운드 완료':'';$('clock').textContent=p?fmt(p.end-elapsed):'00:00';$('phase').textContent=!p?'수고하셨습니다':!running?(elapsed?'일시정지':'준비'):p.kind==='rest'?'휴식':p.section==='쿨다운'?'마무리':'운동';$('sub').textContent=p?(p.mid?(elapsed-p.start<p.mid?'전반':'후반'):p.kind==='rest'?'휴식':p.section==='워밍업'?(p.start%40===0?'전반':'후반'):''):'50분 완료';$('total').textContent='남은 시간 '+fmt(TOTAL-elapsed);$('bar').style.width=(elapsed/TOTAL*100)+'%';$('ring').style.strokeDashoffset=1068.14*(p?(elapsed-p.start)/p.duration:1);const upcoming=PLAN[k+1];$('next').textContent=p&&upcoming?upcoming.section==='전환'?'구간 전환':upcoming.label:'오늘 수업 마무리';$('nextTime').textContent=p&&upcoming?fmt(upcoming.duration):'';$('go').textContent=running?'일시정지':elapsed>=TOTAL?'완료':elapsed>0?'이어서':'시작';$('go').disabled=elapsed>=TOTAL;$('prev').disabled=elapsed===0;$('nextBtn').disabled=elapsed>=TOTAL;const rounds=p?PLAN.filter(x=>x.section===p.section&&x.kind==='work'&&(p.section!=='워밍업'||x.start%40===0)):[];const active=p?rounds.filter(x=>x.start<=p.start).length-1:-1;const dotsKey=(p?.section??'done')+active;if($('dots').dataset.key!==dotsKey){$('dots').dataset.key=dotsKey;$('dots').innerHTML=rounds.map((x,i)=>'<i class="dot '+(i===active?'active':i<active?'past':'')+'"></i>').join('');}}
function pause(){stopVoice();syncTime();running=false;release();save();render();}
async function start(){if(running||elapsed>=TOTAL)return;if(!await unlock()&&sound)return;if(running)return;running=true;base=elapsed;epoch=performance.now();prevElapsed=elapsed;lock();bell(2);if(Math.abs(elapsed-PLAN[at(elapsed)].start)<.1)announce(at(elapsed));else{const r=roundInfo(PLAN[at(elapsed)]);if(r)say(r.n+' 라운드');}render();}
function move(t){stopVoice();syncTime();elapsed=Math.max(0,Math.min(TOTAL,t));base=elapsed;epoch=performance.now();prevElapsed=elapsed;if(elapsed===TOTAL){running=false;release();}if(running&&elapsed<TOTAL)announce(at(elapsed));save();render();}
function tick(){if(running){syncTime();let old=at(prevElapsed),now=at(elapsed);if(elapsed-prevElapsed<2){if(old!==now){bell(now<0?3:2);announce(now,old);}else if(now>=0){const p=PLAN[now];if(p.mid&&prevElapsed<p.start+p.mid&&elapsed>=p.start+p.mid)tone(1200,.25);else if(Math.ceil(p.end-elapsed)<=3&&Math.ceil(p.end-elapsed)!==Math.ceil(p.end-prevElapsed))warning();}}if(elapsed>=TOTAL){running=false;release();save();}if(performance.now()-lastSaved>1000){save();lastSaved=performance.now();}prevElapsed=elapsed;render();}requestAnimationFrame(tick);}
$('voiceTest').onclick=async()=>{if(await unlock()){stopVoice();if(sound)playClip('쉐도우 시작. 1 라운드',0,true);}};
$('voice').onclick=async()=>{voice=!voice;stopVoice();$('voice').textContent=voice?'음성 안내 켜짐':'음성 안내 꺼짐';$('voice').setAttribute('aria-pressed',String(voice));if(voice&&await unlock())say('쉐도우 시작. 1 라운드');};$('warningTest').onclick=async()=>{if(!await unlock())return;playClip('warning');playClip('warning',1);playClip('warning',2);playClip('bell',3);};
$('settings').onclick=()=>$('panel').showModal();$('close').onclick=()=>$('panel').close();$('volume').oninput=e=>{volume=Number(e.target.value);};
$('go').onclick=()=>running?pause():start();$('prev').onclick=()=>{syncTime();const k=at(elapsed);move(PLAN[Math.max(0,(k<0?PLAN.length:k)-1)].start);};$('nextBtn').onclick=()=>{syncTime();const k=at(elapsed);if(k>=0)move(PLAN[k+1]?.start??TOTAL);};
$('reset').onclick=()=>{if(elapsed>0&&!confirm('타이머를 처음으로 되돌릴까요?'))return;pause();move(0);};
$('sound').onclick=async()=>{sound=!sound;if(!sound)stopVoice();$('sound').textContent=sound?'소리 켜짐':'소리 꺼짐';$('sound').setAttribute('aria-pressed',String(sound));if(sound){await unlock();tone();}};
$('test').onclick=async()=>{await unlock();bell(2);};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){$('full').textContent='전체 화면 미지원';}};
PLAN.forEach((p,i)=>{if(i===0||p.section!==PLAN[i-1].section){const o=document.createElement('option');o.value=p.start;o.textContent=fmt(p.start)+' '+p.section;$('jump').appendChild(o);}});$('jump').onchange=e=>move(Number(e.target.value));
[['워밍업','4분'],['스탠스와 풋워크','3분 × 2R / 사이 휴식 1분'],['쉐도우','3분 × 6R / 사이 휴식 1분'],['파트너','2분 × 2R / 사이 휴식 1분'],['컨디셔닝','20초/10초 × 4, 30초/15초 × 2, 30초/15초 × 4'],['쿨다운','2분'],['구간 전환','30초 × 5']].forEach(([s,t])=>{const li=document.createElement('li');li.textContent=s+' — '+t;$('outline').appendChild(li);});
document.addEventListener('keydown',e=>{if(['BUTTON','SELECT','INPUT'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();running?pause():start();}if(e.key==='ArrowRight')$('nextBtn').click();if(e.key==='ArrowLeft')$('prev').click();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&running)lock();});window.addEventListener('pagehide',()=>{syncTime();save();});
try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Date.now()-v.at<7200000&&Number.isFinite(v.elapsed))elapsed=Math.max(0,Math.min(TOTAL,v.elapsed));}catch(e){}
render();requestAnimationFrame(tick);
</script></body></html>
